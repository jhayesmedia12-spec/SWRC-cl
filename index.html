<!DOCTYPE html>
<html>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- we import arjs version without NFT but with marker + location based support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <body style="margin : 0px; overflow: hidden;">
        <a-scene embedded arjs>
        <a-marker preset="https://raw.githubusercontent.com/jhayesmedia12-spec/SWRC-cl/main/HIRO.jpg"> 
            <!-- we use cors proxy to avoid cross-origin problems ATTENTION! you need to set up your server -->
            <a-entity
    id="myModel"
    gltf-model="url(./Ps1%20pizza.glb)"
    position="0 0 0"
    rotation="0 0 0"
    scale="1 1 1">
</a-entity>

<script>
  const model = document.querySelector("#myModel");

  model.addEventListener("model-loaded", () => {
    console.log("SUCCESS: Your custom GLB loaded!");
    console.log("Model details:", model.getObject3D("mesh"));
  });

  model.addEventListener("model-error", (event) => {
    console.error("GLB LOAD ERROR:", event.detail);
  });
</script>
